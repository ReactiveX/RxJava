name: Announce RxJava Release on @RxJava

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install twitter-api-v2
        run: npm install --no-save --no-package-lock twitter-api-v2@1

      - name: Post to @RxJava
        env:
          X_APP_KEY: ${{ secrets.X_APP_KEY }}
          X_APP_SECRET: ${{ secrets.X_APP_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'EOF'
          import { TwitterApi } from 'twitter-api-v2';

          const client = new TwitterApi({
            appKey: process.env.X_APP_KEY,
            appSecret: process.env.X_APP_SECRET,
            accessToken: process.env.X_ACCESS_TOKEN,
            accessSecret: process.env.X_ACCESS_SECRET,
          });

          const tag = process.env.TAG;
          const message = `RxJava ${tag} released!🤘

          💿 or'd 🗨️ https://dsc.gg/rxjava

          Changelog  🫴 https://github.com/ReactiveX/RxJava/releases/tag/${tag}

          🫡 @akarnokd`.replace(/^ {10}/gm, '');

          try {
            const { data } = await client.v2.tweet(message);
            console.log(`Posted: https://x.com/RxJava/status/${data.id}`);
          } catch (e) {
            console.error(e?.data ?? e);
            process.exit(1);
          }
          EOF
